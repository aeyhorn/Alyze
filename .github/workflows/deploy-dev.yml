name: Deploy to DEV

# Auto-deploys BDX-Intelligence to the DEV host (192.168.82.33) on every push
# to `main`. Fully automated — no human in the loop for DEV.
#
# Pipeline:
#   1. Build Docker image (bdx-intelligence:<sha> + :dev) on a GitHub-hosted
#      runner. Push to GitHub Container Registry (ghcr.io).
#   2. Deploy job runs on the self-hosted runner ON the DEV host, pulls the
#      image from ghcr.io, runs migrations, restarts services. No SSH hop.
#   3. Smoke test: `bdx-collect diagnose` + `GET /health/live` must return 200.
#
# Prerequisites:
#   * Self-hosted runner registered on the DEV host (user docadm, docker group)
#     with labels [self-hosted, linux]. See scripts/prepare-dev-host.sh.
#   * Deploy path /home/docadm/bdx-intelligence on the DEV host containing
#     .env (NOT in the repo — scp'd once, maintained on the host).
#     docker-compose.yml is refreshed from the repo on each deploy.
#
# No SSH secrets needed — the runner IS the DEV host and runs compose directly.
# DEV is always deployed with SL_DRY_RUN=true (enforced in .env on the host).
# PROD deploys are a separate, approval-gated workflow (deploy-prod.yml).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  # ghcr.io requires lowercase image paths. github.repository preserves case
  # (e.g. "aeyhorn/Alyze"), so we lowercase it in the meta step below and pass
  # the result to the deploy job via outputs. Do NOT use github.repository
  # directly in a tag — it produces an invalid reference (build fails in ~10s).
  IMAGE: ghcr.io/${{ github.repository }}/bdx-intelligence

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}/bdx-intelligence" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        working-directory: bdx-intelligence
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "${{ steps.meta.outputs.image }}:dev" \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" \
            --push \
            .

  deploy:
    name: Deploy to DEV host
    needs: build
    # Self-hosted runner ON the DEV host (192.168.82.33). Runs docker compose
    # directly — no SSH hop. Register the runner:
    #   Settings → Actions → Runners → New self-hosted runner → Linux x64
    # Install on the DEV host itself (user docadm, in the docker group).
    # The deploy path (~/bdx-intelligence) holds docker-compose.yml + .env
    # (the .env is NOT in the repo — it was scp'd once and is maintained on
    # the host). The compose file is refreshed from the repo on each deploy.
    runs-on: [self-hosted, linux]
    environment: dev
    permissions:
      packages: read
    env:
      BDX_IMAGE: ${{ needs.build.outputs.image }}:dev
      DEPLOY_PATH: /home/docadm/bdx-intelligence
    steps:
      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - uses: actions/checkout@v4

      - name: Sync docker-compose.yml to deploy path
        run: cp bdx-intelligence/docker-compose.yml "$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy + smoke test
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Safety: DEV must keep SL_DRY_RUN=true.
          if grep -q '^SL_DRY_RUN=false' .env; then
            echo "ABORT: DEV .env has SL_DRY_RUN=false — refusing to deploy." >&2
            exit 1
          fi
          export BDX_IMAGE="${BDX_IMAGE}"
          echo "Deploying image: ${BDX_IMAGE}"
          docker compose pull
          docker compose run --rm migrate
          docker compose up -d --force-recreate collector api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8085/health/live >/dev/null; then
              echo "health ok"; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8085/health/live || (echo "health failed" >&2; exit 1)
          docker compose exec -T collector bdx-collect diagnose || true
          echo "DEV deploy complete."
