name: PR Review

# Automated bug + security review on every pull request, using the Cursor SDK.
#
# Opt-in: requires the `CURSOR_API_KEY` repo secret. Without it the workflow
# posts a single skip-comment and stays green, so CI does not block.
#
# The review posts ONE comment per PR run with two sections (bug, security).
# It does NOT block merge — branch protection handles blocking via the CI
# status checks in ci.yml. This keeps the review advisory and fast.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Cursor Bug + Security Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    defaults:
      run:
        working-directory: bdx-intelligence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gh + cursor-sdk
        run: |
          python -m pip install --upgrade pip
          pip install cursor-sdk
          gh --version || true

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > pr.diff
          echo "diff bytes: $(wc -c < pr.diff)"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Run review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/pr_review.py \
            --pr-number "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --diff-file pr.diff
