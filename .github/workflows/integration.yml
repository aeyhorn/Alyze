name: Integration Tests (nightly)

# Nightly integration tests against the DEV environment.
#
# Runs the `integration`-marked tests that hit real DEV SAP (read-only) and
# the Service Layer (DRY_RUN). Verifies the read contracts and the SL
# write-back audit trail stay green against the live DEV systems.
#
# Required repo secrets (set in repo settings → secrets → actions):
#   SAP_DB_HOST, SAP_DB_NAME, SAP_DB_TRUSTED_CONNECTION (yes)  OR
#   SAP_DB_HOST, SAP_DB_NAME, SAP_DB_USER, SAP_DB_PASSWORD
#   SL_BASE_URL, SL_USERNAME, SL_PASSWORD, SL_COMPANY_DB_DEV
#   POSTGRES_DSN (DEV event store, e.g. on 192.168.82.33:5437)
#
# Safety: SL_DRY_RUN is forced to true by the test fixture, so no real SAP
# writes can ever happen from this workflow.

on:
  schedule:
    # 03:00 UTC nightly
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: integration-nightly
  cancel-in-progress: false

defaults:
  run:
    working-directory: bdx-intelligence

jobs:
  integration:
    name: Integration (DEV SAP + SL DRY_RUN)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAP_DB_HOST: ${{ secrets.SAP_DB_HOST }}
      SAP_DB_NAME: ${{ secrets.SAP_DB_NAME }}
      SAP_DB_TRUSTED_CONNECTION: ${{ secrets.SAP_DB_TRUSTED_CONNECTION }}
      SAP_DB_USER: ${{ secrets.SAP_DB_USER }}
      SAP_DB_PASSWORD: ${{ secrets.SAP_DB_PASSWORD }}
      SAP_DB_ODBC_DRIVER: "ODBC Driver 18 for SQL Server"
      SL_BASE_URL: ${{ secrets.SL_BASE_URL }}
      SL_USERNAME: ${{ secrets.SL_USERNAME }}
      SL_PASSWORD: ${{ secrets.SL_PASSWORD }}
      SL_COMPANY_DB_DEV: ${{ secrets.SL_COMPANY_DB_DEV }}
      SL_ALLOW_INVALID_CERT: "true"
      SL_DRY_RUN: "true"
      POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bdx-intelligence/pyproject.toml

      - name: Install ODBC Driver 18
        run: |
          sudo curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends msodbcsql18 unixodbc-dev gcc g++

      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"

      - name: Run integration tests
        run: pytest -m integration -v --tb=short

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Nightly integration tests failed — see logs. Investigate DEV SAP / SL contracts.');
