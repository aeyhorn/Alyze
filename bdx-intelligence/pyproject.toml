[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bdx-intelligence"
version = "0.2.0"
description = "BDX Intelligence – SAP Business One read-only collector, machine monitor and event engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pyodbc>=5.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
mqtt = [
    "paho-mqtt>=2.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "fakeredis>=2.23.0",
]

[project.scripts]
bdx-collect = "bdx.cli.report:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bdx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/bdx"]
omit = ["*/tests/*"]
