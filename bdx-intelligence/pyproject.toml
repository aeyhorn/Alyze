[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bdx-intelligence"
version = "0.2.0"
description = "BDX Intelligence – SAP Business One read-only collector, machine monitor and event engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pyodbc>=5.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
mqtt = [
    "paho-mqtt>=2.0.0",
]
kafka = [
    "confluent-kafka>=2.5.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "fakeredis>=2.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.32.0",
]

[project.scripts]
bdx-collect = "bdx.cli.report:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bdx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: end-to-end tests against DEV systems (skipped by default; run via nightly cron)",
    "sap_read: integration test that reads from real SAP SQL Server",
    "sl: integration test that calls the Service Layer (always DRY_RUN)",
]

[tool.coverage.run]
source = ["src/bdx"]
omit = ["*/tests/*"]

# ── Ruff: lint + format ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "SIM",                # simplify
    "C4",                 # comprehensions
    "TID",                # tidy-imports
    "RUF",                # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]      # asserts allowed in tests
"alembic/*" = ["E402"]    # module-level imports after alembic config

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy: type checking ──────────────────────────────────────────────────────
# Started permissive so the existing codebase passes CI; tighten over time.
# Target: make sap_sl/, db/, collector/ strict (disallow_untyped_defs=true)
# once the legacy functions are annotated.
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["bdx"]
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
# Legacy functions are not yet annotated; only check bodies of annotated
# functions until the annotation backlog is cleared. Raise to true + enable
# disallow_untyped_defs in the override above once polling.py/snapshots.py
# are annotated (see AGENTS.md "mypy tightening" TODO).
check_untyped_defs = false
no_implicit_optional = true
show_error_codes = true
pretty = true

# Tighten return-type checking for the SAP write channel (highest blast radius).
# Annotations are added incrementally; do not enable disallow_untyped_defs here
# until the legacy functions in polling.py / snapshots.py are annotated.
[[tool.mypy.overrides]]
module = ["bdx.sap_sl.*", "bdx.db.*", "bdx.collector.*"]
warn_return_any = true

# Third-party libs without stubs
[[tool.mypy.overrides]]
module = ["pyodbc.*", "paho.mqtt.*", "confluent_kafka.*"]
ignore_missing_imports = true
