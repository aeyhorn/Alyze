<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDX Intelligence – Promise Platform</title>
<style>
  :root {
    --bg:#0f1419; --panel:#182027; --panel2:#1c2733; --line:#263039;
    --fg:#e6edf3; --muted:#8b98a5;
    --ok:#2ea043; --warn:#d29922; --bad:#f85149; --info:#58a6ff; --idle:#6e7681;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:14px; padding:11px 20px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:10; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; }
  header .spacer { flex:1; }
  header nav { display:flex; gap:6px; flex-wrap:wrap; }
  header nav a { color:var(--muted); font-size:12px; text-decoration:none; padding:3px 8px; border-radius:5px; border:1px solid var(--line); }
  header nav a:hover, header nav a.active { color:var(--fg); border-color:var(--info); }
  main { padding:16px 20px; display:grid; gap:16px; grid-template-columns:repeat(12,1fr); }
  .full { grid-column:span 12; } .half { grid-column:span 6; }
  @media (max-width:1000px) { .half { grid-column:span 12; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .card h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; text-transform:uppercase; }
  .pill.ok { background:rgba(46,160,67,.2); color:var(--ok); }
  .pill.warn { background:rgba(210,153,34,.2); color:var(--warn); }
  .pill.bad { background:rgba(248,81,73,.2); color:var(--bad); }
  .pill.info { background:rgba(88,166,255,.2); color:var(--info); }
  .pill.idle { background:rgba(110,118,129,.25); color:#c9d1d9; }
  label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  input, textarea, select, button {
    font:inherit; color:var(--fg); background:#0b0f13; border:1px solid var(--line); border-radius:6px; padding:7px 10px;
  }
  input, textarea, select { width:100%; }
  textarea { min-height:56px; resize:vertical; }
  .form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .form-grid .wide { grid-column:span 2; }
  @media (max-width:700px) { .form-grid { grid-template-columns:1fr; } .form-grid .wide { grid-column:span 1; } }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button { cursor:pointer; }
  button.primary { background:rgba(88,166,255,.18); border-color:var(--info); color:var(--info); font-weight:600; }
  button.ok { background:rgba(46,160,67,.18); border-color:var(--ok); color:var(--ok); }
  button.bad { background:rgba(248,81,73,.18); border-color:var(--bad); color:var(--bad); }
  button.warn { background:rgba(210,153,34,.18); border-color:var(--warn); color:var(--warn); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:11px; }
  tr { cursor:pointer; }
  tr:hover td { background:rgba(88,166,255,.06); }
  tr.active td { background:rgba(88,166,255,.12); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:12px; }
  .kpi { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; border-left:4px solid var(--idle); }
  .kpi.ok { border-left-color:var(--ok); } .kpi.warn { border-left-color:var(--warn); } .kpi.bad { border-left-color:var(--bad); }
  .kpi .v { font-size:20px; font-weight:700; } .kpi .l { color:var(--muted); font-size:11px; }
  .err { color:var(--bad); font-size:12px; margin-top:8px; }
  .empty { color:var(--muted); font-size:12px; padding:8px 0; }
  .scroll { max-height:420px; overflow:auto; }
  .gap { border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:8px; padding:10px 12px; background:var(--panel2); margin-bottom:8px; }
  .gap.resolved { border-left-color:var(--ok); opacity:.75; }
  .gap .t { font-weight:600; font-size:13px; }
  .gap .m { color:var(--muted); font-size:11px; margin-top:4px; }
  .gap .actions { margin-top:8px; }
  pre { background:#0b0f13; border:1px solid var(--line); border-radius:6px; padding:8px; overflow:auto; font-size:11px; max-height:200px; }
  .bar { height:8px; background:#0b0f13; border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar > span { display:block; height:100%; background:var(--info); }
  a.link { color:var(--info); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>BDX Intelligence</h1>
  <span class="sub">Promise Platform – lebendiges Angebot + Gaps</span>
  <span id="health" class="pill idle">…</span>
  <span class="spacer"></span>
  <nav>
    <a href="/dashboard">Betrieb</a>
    <a href="/vorgang">Vorgänge</a>
    <a href="/analytics">Schwachstellen</a>
    <a href="/q2p">Q2P</a>
    <a class="active" href="/promise">Promise</a>
  </nav>
</header>

<main>
  <section class="card half">
    <h2>Neues Angebot</h2>
    <div class="form-grid">
      <div>
        <label for="item_code">Artikel</label>
        <input id="item_code" placeholder="z.B. 10886" autocomplete="off">
      </div>
      <div>
        <label for="qty">Menge</label>
        <input id="qty" type="number" min="0.001" step="any" value="1">
      </div>
      <div>
        <label for="requested_date">Wunschtermin</label>
        <input id="requested_date" type="date">
      </div>
      <div>
        <label for="customer_ref">Kunden-Ref</label>
        <input id="customer_ref" placeholder="optional">
      </div>
      <div>
        <label for="customer_name">Kunde</label>
        <input id="customer_name" placeholder="optional">
      </div>
      <div>
        <label for="owner">Bearbeiter</label>
        <input id="owner" placeholder="optional">
      </div>
      <div class="wide">
        <label for="datenraum">Datenraum-Pfad (Quoter)</label>
        <input id="datenraum" placeholder="/data/projekte/… (optional)">
      </div>
      <div class="wide">
        <label for="notes">Notiz</label>
        <textarea id="notes"></textarea>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="btn-create">Anlegen &amp; Agenten starten</button>
    </div>
    <div class="err" id="form-err"></div>
  </section>

  <section class="card half">
    <h2>Angebote</h2>
    <div class="actions" style="margin-top:0;margin-bottom:10px">
      <button id="btn-refresh">Aktualisieren</button>
      <select id="filter-status">
        <option value="">alle</option>
        <option value="open">open</option>
        <option value="promisable">promisable</option>
        <option value="decided">decided</option>
        <option value="contracted">contracted</option>
        <option value="draft">draft</option>
      </select>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Zeit</th><th>Artikel</th><th>Status</th><th>Konfidenz</th><th>Gaps</th></tr></thead>
        <tbody id="offer-list"></tbody>
      </table>
    </div>
  </section>

  <section class="card full" id="detail-card">
    <h2>Angebot <span id="detail-title" style="color:var(--fg);text-transform:none;letter-spacing:0;font-size:13px;margin-left:8px"></span></h2>
    <div id="detail-empty" class="empty">Angebot anlegen oder aus der Liste wählen.</div>
    <div id="detail" style="display:none">
      <div class="kpis" id="detail-kpis"></div>
      <div class="actions" id="detail-actions"></div>
      <div style="display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:14px">
        <div>
          <h2 style="margin-top:0">Gaps</h2>
          <div id="gaps"></div>
          <h2>Evidence</h2>
          <div id="evidence" class="scroll" style="max-height:220px"></div>
        </div>
        <div>
          <h2 style="margin-top:0">Vertrag</h2>
          <div id="contract"></div>
          <h2>Agent-Jobs</h2>
          <div id="jobs"></div>
          <h2>Entscheidung</h2>
          <div class="actions">
            <button class="ok" id="btn-accept">Annehmen</button>
            <button class="warn" id="btn-counter">Gegenangebot</button>
            <button class="bad" id="btn-reject">Ablehnen</button>
            <button id="btn-recompute">Neu berechnen</button>
            <button class="primary" id="btn-publish">Vertrag ans Portal</button>
          </div>
          <div class="err" id="decide-err"></div>
          <div id="portal-link" style="margin-top:10px"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const API = '/api/v1';
let current = null;

async function api(path, opts={}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
    ...opts,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.detail || JSON.stringify(j); } catch {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

function statusPill(s) {
  const map = { promisable:'ok', decided:'ok', contracted:'ok', open:'warn', computing:'info', draft:'idle', cancelled:'bad' };
  return `<span class="pill ${map[s]||'idle'}">${s||'?'}</span>`;
}
function confClass(c, thr) {
  if (c >= thr) return 'ok';
  if (c >= thr * 0.7) return 'warn';
  return 'bad';
}
function money(a,b) {
  if (a==null && b==null) return '—';
  if (a!=null && b!=null) return `${a.toLocaleString('de-DE')}–${b.toLocaleString('de-DE')} €`;
  return `${(a??b).toLocaleString('de-DE')} €`;
}

async function refreshHealth() {
  try {
    const h = await fetch('/health').then(r=>r.json());
    const el = document.getElementById('health');
    el.textContent = h.status || 'ok';
    el.className = 'pill ' + (h.status==='ok'?'ok':'warn');
  } catch { document.getElementById('health').textContent = 'offline'; }
}

async function loadList() {
  const st = document.getElementById('filter-status').value;
  const q = st ? `?status=${encodeURIComponent(st)}` : '';
  const rows = await api('/promise/offers' + q);
  const tb = document.getElementById('offer-list');
  tb.innerHTML = rows.map(r => `
    <tr data-id="${r.id}" class="${current&&current.id===r.id?'active':''}">
      <td>${(r.created_at||'').slice(0,16).replace('T',' ')}</td>
      <td>${r.item_code} × ${r.qty}</td>
      <td>${statusPill(r.status)}</td>
      <td>${Math.round((r.confidence||0)*100)}%</td>
      <td>${r.open_gap_count||0}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty">Keine Angebote</td></tr>';
  tb.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => selectOffer(tr.dataset.id));
}

async function selectOffer(id) {
  current = await api('/promise/offers/' + id);
  renderDetail();
  loadList();
}

function renderDetail() {
  const o = current;
  document.getElementById('detail-empty').style.display = o ? 'none' : 'block';
  document.getElementById('detail').style.display = o ? 'block' : 'none';
  if (!o) return;
  document.getElementById('detail-title').textContent = `${o.item_code} · v${o.version} · ${o.id.slice(0,8)}`;
  const thr = o.confidence_threshold || 0.75;
  const cc = confClass(o.confidence, thr);
  document.getElementById('detail-kpis').innerHTML = `
    <div class="kpi ${cc}"><div class="v">${Math.round(o.confidence*100)}%</div><div class="l">Konfidenz (Schwelle ${Math.round(thr*100)}%)</div>
      <div class="bar"><span style="width:${Math.min(100,o.confidence*100)}%"></span></div></div>
    <div class="kpi"><div class="v">${money(o.price_low_eur,o.price_high_eur)}</div><div class="l">Preisband</div></div>
    <div class="kpi"><div class="v">${o.date_early||'—'} → ${o.date_late||'—'}</div><div class="l">Terminband</div></div>
    <div class="kpi"><div class="v">${o.open_gap_count}</div><div class="l">Offene Gaps</div></div>
    <div class="kpi"><div class="v">${statusPill(o.status)}</div><div class="l">Status</div></div>`;

  const gaps = o.gaps || [];
  document.getElementById('gaps').innerHTML = gaps.length ? gaps.map(g => `
    <div class="gap ${g.status==='resolved'||g.status==='waived'?'resolved':''}">
      <div class="t">${g.title}</div>
      <div class="m">${g.gap_type} · ${g.status} · ${g.owner_role}${g.source_agent?' · '+g.source_agent:''}</div>
      ${g.detail?`<div class="m">${g.detail}</div>`:''}
      ${g.status==='open'||g.status==='in_progress'?`
        <div class="actions">
          <button data-resolve="${g.id}">Erledigt</button>
          <button data-waive="${g.id}">Waive</button>
        </div>`:''}
    </div>`).join('') : '<div class="empty">Keine Gaps</div>';

  document.getElementById('gaps').querySelectorAll('[data-resolve]').forEach(b => b.onclick = () => resolveGap(b.dataset.resolve, false));
  document.getElementById('gaps').querySelectorAll('[data-waive]').forEach(b => b.onclick = () => resolveGap(b.dataset.waive, true));

  const ev = o.evidence || [];
  document.getElementById('evidence').innerHTML = ev.length ? ev.slice(0,40).map(e =>
    `<div class="m" style="padding:4px 0;border-bottom:1px solid var(--line)"><b>${e.kind}</b> ${e.label}</div>`
  ).join('') : '<div class="empty">—</div>';

  const jobs = o.jobs || [];
  document.getElementById('jobs').innerHTML = jobs.length ? `<table><thead><tr><th>Agent</th><th>Status</th><th>Summary</th></tr></thead><tbody>
    ${jobs.map(j => `<tr><td>${j.kind}</td><td>${j.status}</td><td>${(j.result_payload&&j.result_payload.summary)||j.error||''}</td></tr>`).join('')}
  </tbody></table>` : '<div class="empty">—</div>';

  const c = o.contract;
  document.getElementById('contract').innerHTML = c ? `
    <div>${statusPill(c.status)} v${c.version} ${c.customer_visible?'· portal':'· intern'}</div>
    <div class="m" style="margin:6px 0">${c.title}</div>
    <pre>${JSON.stringify(c.body,null,2)}</pre>` : '<div class="empty">Noch kein Vertrag</div>';

  document.getElementById('portal-link').innerHTML = o.portal_token
    ? `<a class="link" href="/portal/${o.portal_token}" target="_blank">Kundenportal öffnen →</a>
       <div class="m">Token: ${o.portal_token}</div>` : '';
}

async function resolveGap(id, waive) {
  const note = prompt(waive ? 'Waive-Grund:' : 'Erledigt-Notiz:') || (waive?'waived':'resolved');
  await api(`/promise/offers/${current.id}/gaps/${id}/resolve`, {
    method:'POST', body: JSON.stringify({ resolution_note: note, waive })
  });
  await selectOffer(current.id);
}

document.getElementById('btn-create').onclick = async () => {
  const err = document.getElementById('form-err'); err.textContent = '';
  try {
    const body = {
      item_code: document.getElementById('item_code').value.trim(),
      qty: Number(document.getElementById('qty').value),
      requested_date: document.getElementById('requested_date').value || null,
      customer_ref: document.getElementById('customer_ref').value || null,
      customer_name: document.getElementById('customer_name').value || null,
      owner: document.getElementById('owner').value || null,
      datenraum: document.getElementById('datenraum').value || null,
      notes: document.getElementById('notes').value || null,
      recompute: true,
    };
    if (!body.item_code) throw new Error('Artikel fehlt');
    current = await api('/promise/offers', { method:'POST', body: JSON.stringify(body) });
    renderDetail(); await loadList();
  } catch (e) { err.textContent = e.message; }
};

async function decide(decision) {
  const err = document.getElementById('decide-err'); err.textContent = '';
  try {
    current = await api(`/promise/offers/${current.id}/decide`, {
      method:'POST', body: JSON.stringify({ decision, decision_note: decision })
    });
    renderDetail(); await loadList();
  } catch (e) { err.textContent = e.message; }
}
document.getElementById('btn-accept').onclick = () => decide('accept');
document.getElementById('btn-counter').onclick = () => decide('counter');
document.getElementById('btn-reject').onclick = () => decide('reject');
document.getElementById('btn-recompute').onclick = async () => {
  current = await api(`/promise/offers/${current.id}/recompute`, { method:'POST', body:'{}' });
  renderDetail(); await loadList();
};
document.getElementById('btn-publish').onclick = async () => {
  const err = document.getElementById('decide-err'); err.textContent = '';
  try {
    await api(`/promise/offers/${current.id}/contract/publish`, {
      method:'POST', body: JSON.stringify({ customer_visible: true })
    });
    await selectOffer(current.id);
  } catch (e) { err.textContent = e.message; }
};
document.getElementById('btn-refresh').onclick = loadList;
document.getElementById('filter-status').onchange = loadList;

refreshHealth();
loadList();
</script>
</body>
</html>
